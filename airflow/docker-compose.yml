name: airflow

services:

  postgres:
    image: postgres:15

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data


  airflow-init:

    image: apache/airflow:2.10.2-python3.12

    depends_on:
      - postgres

    env_file:
      - .env

    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW_UID: 50000

      PYTHONPATH: /opt/airflow


    volumes:

      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - ../app:/opt/airflow/app


    user: "50000:0"


    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --firstname Pradeep
      --lastname Arkachar
      --role Admin
      --email admin@example.com
      --password admin || true
      "



  airflow-webserver:

    image: apache/airflow:2.10.2-python3.12


    depends_on:

      airflow-init:
        condition: service_completed_successfully


    env_file:
      - .env


    environment:


      AIRFLOW__CORE__EXECUTOR: LocalExecutor


      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow


      AIRFLOW__WEBSERVER__SECRET_KEY: airflow-secret


      AIRFLOW__CORE__LOAD_EXAMPLES: "false"


      AIRFLOW_UID: 50000


      PYTHONPATH: /opt/airflow



    volumes:


      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - ../app:/opt/airflow/app



    user: "50000:0"


    ports:

      - "8080:8080"


    command:

      - airflow

      - webserver




  airflow-scheduler:


    image: apache/airflow:2.10.2-python3.12


    depends_on:


      airflow-init:

        condition: service_completed_successfully



    env_file:

      - .env



    environment:


      AIRFLOW__CORE__EXECUTOR: LocalExecutor


      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow


      AIRFLOW_UID: 50000


      PYTHONPATH: /opt/airflow




    volumes:


      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - ../app:/opt/airflow/app




    user: "50000:0"



    command:


      - airflow

      - scheduler



volumes:

  postgres-db-volume: